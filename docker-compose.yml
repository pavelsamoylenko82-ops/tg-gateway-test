version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: tg_gateway_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: tg_gateway
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: tg_gateway_web
    restart: always
    ports:
      - "8080:8000"
    env_file:
      - .env
    depends_on:
      - db

volumes:
  postgres_data: